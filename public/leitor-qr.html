<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FaceAI — Leitor QR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{color-scheme:light;--ink:#17243a;--muted:#64748b;--line:#e2e8f0;--blue:#1769aa;--blue-dark:#124f83;--surface:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:linear-gradient(135deg,#edf5ff,#f7f9fc 55%,#eef6f5);color:var(--ink);font:16px Inter,Arial,sans-serif}
.box{max-width:760px;margin:18px auto;background:#fff;padding:clamp(18px,4vw,30px);border:1px solid #e5edf5;border-radius:22px;box-shadow:0 18px 55px #17324d12}
header{margin-bottom:22px}header .eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(25px,5vw,34px);margin:8px 0}header p{color:var(--muted);line-height:1.55;margin:0}
button{padding:12px 17px;border:0;border-radius:11px;background:var(--blue);color:white;font-weight:750;cursor:pointer;transition:.15s}button:hover{background:var(--blue-dark)}button:disabled{opacity:.55;cursor:wait}
#reader{margin-top:18px;overflow:hidden;border-radius:14px}
.status{padding:13px 15px;background:#eff6ff;border:1px solid #dbeafe;color:#23466c;border-radius:12px;margin-top:15px;line-height:1.45}
.student-card{display:block;margin-top:20px;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 12px 32px #102a4310}
.profile-top{display:flex;align-items:center;gap:20px;padding:22px;background:linear-gradient(120deg,#eaf4ff,#f5f9ff)}
.student-photo{width:260px;height:300px;flex:0 0 260px;object-fit:cover;border-radius:16px;background:#dce8f3;border:3px solid white;box-shadow:0 5px 18px #163b5b20}
.photo-placeholder{display:grid;place-items:center;width:260px;height:300px;flex:0 0 260px;border-radius:16px;background:#dce8f3;color:#58718a;font-size:13px;text-align:center;padding:12px}
.profile-name{min-width:0}.profile-kicker{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}.profile-name h2{font-size:clamp(22px,4vw,29px);line-height:1.15;margin:7px 0 8px;overflow-wrap:anywhere}.profile-meta{margin:0;color:#52657a;font-size:14px;line-height:1.6}
.favorites{padding:20px 22px 22px}.favorites h3{font-size:14px;margin:0 0 13px;color:#52657a;text-transform:uppercase;letter-spacing:.08em}
.favorite-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.favorite-item{display:flex;align-items:center;gap:12px;min-width:0;padding:13px;border:1px solid #e7edf3;border-radius:14px;background:#fbfdff}
.favorite-icon{display:grid;place-items:center;width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:#edf5fc;font-size:20px}
.favorite-copy{min-width:0}.favorite-label{display:block;margin-bottom:6px;color:#718096;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.favorite-value{display:inline-block;color:#102a43;font-size:16px;font-weight:900;line-height:1.35;overflow-wrap:anywhere;background:#e8f2fc;border-radius:7px;padding:4px 8px;text-shadow:0 0 .35px currentColor}
.attendance-line{margin:0 22px 20px;padding:12px 14px;border-radius:12px;background:#effaf3;color:#17613a;font-size:14px;font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:25px 0}h2.section-title{font-size:19px;margin:0 0 13px}
#reviews section{margin-top:12px}
@media(max-width:520px){body{padding:12px 9px}.box{margin:8px auto;padding:17px;border-radius:17px}.profile-top{align-items:flex-start;gap:14px;padding:16px}.student-photo,.photo-placeholder{width:180px;height:210px;flex-basis:180px}.favorite-grid{grid-template-columns:1fr}.favorites{padding:17px}.attendance-line{margin:0 17px 17px}}
</style>
</head>
<body>
<main class="box">
<header><span class="eyebrow">FaceAI • Controle de presença</span><h1>Leitor de QR Code</h1><p>Entre com a conta do professor e inicie a câmera para identificar o aluno e registrar a presença.</p></header>
<button id="start">Permitir câmera e iniciar leitor</button>
<div id="reader" style="margin-top:18px;background:#10283d;border-radius:14px;overflow:hidden;min-height:180px;display:none"><video id="cameraPreview" playsinline muted style="display:block;width:100%;max-height:65vh;object-fit:cover"></video><canvas id="qrCanvas" hidden></canvas></div>
<div id="status" class="status">Aguardando autenticação.</div>
<div id="studentCard" class="student-card" hidden></div>
<hr>
<h2 class="section-title">Revisão da direção</h2>
<button id="loadReviews" type="button">Ver pendências</button>
<div id="reviews"></div>
</main>
<script>
const statusEl=document.getElementById('status');
let client,cameraStream=null,scanFrame=null,locked=false,scanCanvas,scanContext;
function say(t){statusEl.textContent=t}
function stopCamera(){
 if(scanFrame)cancelAnimationFrame(scanFrame);
 scanFrame=null;
 if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;}
 const video=document.getElementById('cameraPreview');
 if(video){video.pause();video.srcObject=null;}
 document.getElementById('reader').style.display='none';
}
function cameraError(error){
 const name=error?.name||'';
 if(name==='NotAllowedError'||name==='PermissionDeniedError')return 'O Chrome/Samsung bloqueou a câmera. Libere a permissão do site nas configurações do Chrome e tente novamente.';
 if(name==='NotFoundError'||name==='DevicesNotFoundError')return 'Nenhuma câmera foi encontrada neste dispositivo.';
 if(name==='NotReadableError'||name==='TrackStartError')return 'A câmera está sendo usada por outro aplicativo. Feche outros apps que usam a câmera e tente novamente.';
 if(name==='OverconstrainedError')return 'A câmera traseira não está disponível. Verifique se a câmera do celular funciona normalmente.';
 return 'Não foi possível abrir a câmera: '+(error?.message||name||'erro desconhecido');
}
async function start(){
 const button=document.getElementById('start');
 if(cameraStream){stopCamera();button.textContent='Permitir câmera e iniciar leitor';say('Câmera desligada.');return;}
 if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){say('O navegador não liberou a câmera. Abra o FaceAI pelo Chrome usando o endereço HTTPS.');return;}
 if(!window.jsQR){say('O leitor QR não carregou. Verifique a conexão e atualize a página.');return;}
 button.disabled=true;say('Solicitando permissão para usar a câmera…');
 try{
  // Solicita a câmera imediatamente durante o toque do usuário, antes de qualquer chamada de rede.
  try{
   cameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
  }catch(firstError){
   if(firstError?.name==='OverconstrainedError'){
    cameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:true});
   }else throw firstError;
  }
  const video=document.getElementById('cameraPreview');
  video.srcObject=cameraStream;
  await video.play();
  document.getElementById('reader').style.display='block';
  scanCanvas=document.getElementById('qrCanvas');
  scanContext=scanCanvas.getContext('2d',{willReadFrequently:true});
  say('Câmera ativa. Aponte para o QR Code do aluno.');
  client=window.supabase.createClient(FACEAI_CONFIG.url,FACEAI_CONFIG.anonKey);
  const {data:{session},error}=await client.auth.getSession();
  if(error||!session){
   stopCamera();say('Câmera liberada, mas falta entrar na conta do professor. Faça login no FaceAI e abra novamente o leitor.');return;
  }
  const scan=async()=>{
   if(!cameraStream||video.readyState!==video.HAVE_ENOUGH_DATA){scanFrame=requestAnimationFrame(scan);return;}
   const width=video.videoWidth,height=video.videoHeight;
   if(width&&height){
    if(scanCanvas.width!==width||scanCanvas.height!==height){scanCanvas.width=width;scanCanvas.height=height;}
    scanContext.drawImage(video,0,0,width,height);
    const pixels=scanContext.getImageData(0,0,width,height);
    const code=window.jsQR(pixels.data,width,height,{inversionAttempts:'attemptBoth'});
    if(code?.data&&!locked){await processQr(code.data,session.access_token);}
   }
   scanFrame=requestAnimationFrame(scan);
  };
  scanFrame=requestAnimationFrame(scan);
 }catch(error){
  stopCamera();say(cameraError(error));
 }finally{button.disabled=false;button.textContent=cameraStream?'Desligar câmera':'Permitir câmera e iniciar leitor';}
}
async function processQr(decoded,accessToken){
 if(locked)return;locked=true;say('QR lido. Validando presença…');
 try{
  const {data,error}=await client.functions.invoke('record-attendance-by-qr',{headers:{Authorization:`Bearer ${accessToken}`},body:{token:decoded.trim()}});
  if(error||data?.error){
   let detail=data?.error||error?.message||'Falha ao validar QR.';
   try{if(error?.context){const response=error.context.clone();const payload=await response.json();if(payload?.error)detail=payload.error;}}catch{}
   say(detail);
  }else if(data.status==='already_recorded'){say(data.message||'Presença já registrada hoje.');showStudent(data.student,data.attendance);}
  else if(data.status==='pending_review'){say(data.message||'Solicitação enviada para revisão da direção. A presença ainda não foi confirmada.');showStudent(data.student,null);}
  else if(data.status==='recorded'&&data.student&&data.attendance){say('Presença registrada: '+data.student.name+' — '+data.attendance.date);showStudent(data.student,data.attendance);}
  else{say('Resposta inesperada do servidor. A presença não foi confirmada; consulte a direção.');}
 }catch(error){say('Erro ao validar QR: '+error.message);}
 setTimeout(()=>{locked=false;if(cameraStream)say('Pronto para ler o próximo QR Code.');},2500);
}
async function loadReviews(){
 const host=document.getElementById('reviews');host.textContent='Carregando…';
 if(!client){host.textContent='Entre primeiro pelo botão acima.';return}
 const {data,error}=await client.functions.invoke('review-qr-attendance',{body:{action:'list'}});
 if(error||data?.error){host.textContent=data?.error||error?.message||'Falha ao carregar.';return}
 host.replaceChildren();
 if(!data.reviews?.length){host.textContent='Nenhuma pendência.';return}
 data.reviews.forEach(r=>{
  const card=document.createElement('section');card.className='status';
  const name=r.students?.name||'Aluno';
  const reason=r.reason==='student_without_class'?'Aluno sem turma':'Professor sem vínculo com a turma';
  const title=document.createElement('p');title.textContent=name+' — '+r.attendance_date+' — '+reason;
  card.appendChild(title);
  ['approve','reject'].forEach(decision=>{
   const b=document.createElement('button');b.type='button';b.textContent=decision==='approve'?'Aprovar presença':'Rejeitar';
   b.style.marginRight='8px';b.onclick=async()=>{
    b.disabled=true;
    const result=await client.functions.invoke('review-qr-attendance',{body:{action:'decide',review_id:r.id,decision}});
    if(result.error||result.data?.error){say(result.data?.error||result.error?.message||'Falha ao revisar.');b.disabled=false;}
    else{say(result.data.message);loadReviews();}
   };card.appendChild(b);
  });
  host.appendChild(card);
 });
}
document.getElementById('loadReviews').onclick=loadReviews;
document.getElementById('start').onclick=start;
</script>
</body>
</html>
